# Copiar como config.local.properties. Este archivo local queda fuera de Git.
# Se pueden usar DB_URL, DB_USER y DB_PASSWORD en lugar del archivo.
db.url=jdbc:mysql://localhost:3306/Tienda_Electronica?useSSL=false&serverTimezone=America/Bogota&connectTimeout=3000&socketTimeout=10000
db.user=root
db.password=root
# auto intenta MySQL al iniciar y usa H2 si no está disponible.
# mysql exige MySQL; embedded usa una base en archivo sin instalar un servidor.
db.mode=auto
# Si se omite, H2 guarda datos en ~/.tienda-electronica/data/tienda.
# db.embedded.path=data/tienda
# Ruta absoluta con / o ruta relativa al proyecto. Nunca incluir la clave en el JAR.
# Si se omite, se busca un único *-firebase-adminsdk-*.json en la raíz.
# También se admite la variable GOOGLE_APPLICATION_CREDENTIALS.
# firebase.credentials=nombre-de-la-cuenta-firebase-adminsdk.json
